[metadata]
name = shmoopy
version = file: src/shmoopy/version.txt
description = Multivariate parameter sweep framework
long_description = file: README.md
long_description_content_type = text/x-md
author = Steve Nicholes
license = MIT
url = https://github.com/endangeredoxen/shmoopy
download_url = https://github.com/endangeredoxen/shmoopy/archive/refs/tags/v0.1.0-alpha.tar.gz
platforms = linux, osx, win32
classifiers=
    Programming Language :: Python :: 3

[options]
package_dir=
    =src
packages=find:
include_package_data = True
install_requires =
    pandas >= 2
    pyyaml
python_requires = >=3.7

[options.extras_require]
test = pytest==8.3.3
       pytest-benchmark==4.0.0
       pytest-cov==5.0.0
       flake8==7.1.1
       pandas==2.2.3
       numpy==2.1.1
       osascript==2020.12.3; platform_system=="Darwin"
doc = sphinx==8.1.3
      nbsphinx==0.8.6
      pydata-sphinx-theme==0.16.1
      sphinx-copybutton==0.5.2
      sphinx_design==0.5.0
      sphinx_rtd_theme==0.5.2
      sphinxcontrib-napoleon==0.7
      nbconvert==5.6.1
      jupyter==1.0.0
      jupyter-contrib-nbextensions==0.5.1
      jupyterlab-pygments==0.1.2
      jupyter-contrib-core==0.3.3
      jinja2==3.0.1
      pandoc==2.2
      colour-demosaicing==0.2.2
      sphinxcontrib-spelling==8.0.1

[options.packages.find]
where = src
exclude = contrib, docs, __pycache__, tests*

[options.package_data]
shmoopy = version.txt, examples/*

[flake8]
max-line-length = 120
docstring-convention = google